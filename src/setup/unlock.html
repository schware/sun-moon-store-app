<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>SunMoon Store — 관리자</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>관리자</h1>
    <form id="unlock">
      <label for="pin">관리자 PIN</label>
      <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" autofocus />
      <div id="error" class="error" role="alert" hidden></div>
      <button id="submit" type="submit">확인</button>
      <button id="back" type="button" class="secondary">돌아가기</button>
    </form>
    <div id="actions" hidden>
      <p class="muted">잠금이 풀렸습니다(2분). 무엇을 할까요?</p>
      <button data-act="window" type="button">창 모드로 (전체 화면 풀기)</button>
      <button data-act="quit" type="button">앱 끄기</button>
      <button data-act="forget" type="button" class="danger">페어링 지우기 (코드를 다시 받아야 함)</button>
      <button data-act="back" type="button" class="secondary">돌아가기</button>
    </div>
  </main>
  <script src="unlock.js"></script>
</body>
</html>
